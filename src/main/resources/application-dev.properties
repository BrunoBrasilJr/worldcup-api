# ===== PERFIL DEV - banco H2 em memoria (sobe rapido, zera a cada restart) =====
spring.datasource.url=jdbc:h2:mem:worldcupdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - validate: Hibernate apenas CONFERE o esquema, nao altera.
# Quem cria/altera tabelas agora e o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 (util em dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway habilitado (roda as migracoes no boot)
spring.flyway.enabled=true