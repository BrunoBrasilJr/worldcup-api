# ===== PERFIL DEV - banco H2 em memoria =====
spring.datasource.url=jdbc:h2:mem:worldcupdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=true

# ===== Logging (dev: mais verboso) =====
# Nivel raiz INFO, mas o nosso pacote em DEBUG para ver detalhes.
logging.level.root=INFO
logging.level.com.portfolio.worldcup=DEBUG
# Padrao de console legivel: hora, nivel, classe abreviada, mensagem.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] - %msg%n