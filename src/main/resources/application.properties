# ===== Configuracao COMUM a todos os ambientes =====
spring.application.name=worldcup-api

# Profile ativo por padrao (dev = H2). Para producao, rode com prod.
spring.profiles.active=dev

# ===== API-Football (ingestao) - comum aos ambientes =====
apifootball.base-url=https://v3.football.api-sports.io
apifootball.key=${API_FOOTBALL_KEY:}

# ===== Scheduler de ingestao - comum aos ambientes =====
# true = ingestao automatica ligada. false = so manual via /admin/ingest-live.
ingestion.enabled=true

# ===== Actuator (observabilidade) =====
# Expoe SOMENTE health e info (seguranca: nao expor env, beans, etc. publicamente).
management.endpoints.web.exposure.include=health,info
# Mostra detalhes do health (status do banco, etc.) sempre.
management.endpoint.health.show-details=always
# Habilita o endpoint /actuator/info
management.info.env.enabled=true