# ===== Configuracao COMUM a todos os ambientes =====
spring.application.name=worldcup-api

# Profile ativo por padrao (dev = H2). Para producao, rode com prod.
spring.profiles.active=dev

# ===== API-Football (ingestao) - comum aos ambientes =====
apifootball.base-url=https://v3.football.api-sports.io
apifootball.key=${API_FOOTBALL_KEY:}
apifootball.league=1
apifootball.season=2026

# ===== Scheduler de ingestao - comum aos ambientes =====
ingestion.enabled=true

# ===== Actuator (observabilidade) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ===== Flyway =====
spring.flyway.enabled=true

# ===== Resilience4j Retry (instancia "apiFootball") =====
resilience4j.retry.instances.apiFootball.max-attempts=3
resilience4j.retry.instances.apiFootball.wait-duration=1s
resilience4j.retry.instances.apiFootball.enable-exponential-backoff=true
resilience4j.retry.instances.apiFootball.exponential-backoff-multiplier=2
resilience4j.retry.instances.apiFootball.enable-randomized-wait=true
resilience4j.retry.instances.apiFootball.randomized-wait-factor=0.5
resilience4j.retry.instances.apiFootball.retry-exceptions=com.portfolio.worldcup.ingestion.exception.TransientApiException