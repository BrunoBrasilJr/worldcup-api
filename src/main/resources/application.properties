# ===== Nome da aplicacao =====
spring.application.name=worldcup-api

# ===== Banco de dados PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/worldcupdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Painel visual do H2 (desativado: agora usamos Postgres) =====
spring.h2.console.enabled=false

# ===== API-Football (ingestao) =====
apifootball.base-url=https://v3.football.api-sports.io
apifootball.key=${API_FOOTBALL_KEY:}

# ===== Scheduler de ingestao =====
# true = ingestao automatica ligada (a cada 30 min). false = so manual via /admin/ingest-live.
ingestion.enabled=true