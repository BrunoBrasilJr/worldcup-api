# ===== Nome da aplicacao =====
spring.application.name=worldcup-api

# ===== Banco de dados H2 (em memoria) =====
spring.datasource.url=jdbc:h2:mem:worldcupdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Painel visual do H2 (console web) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== API-Football (ingestao) =====
# A chave vem de uma variavel de ambiente chamada API_FOOTBALL_KEY.
# Se a variavel nao existir, fica vazia (e o app avisa).
apifootball.base-url=https://v3.football.api-sports.io
apifootball.key=${API_FOOTBALL_KEY:}

# ===== Scheduler de ingestao =====
# true = ingestao automatica ligada (a cada 30 min). false = so manual via /admin/ingest-live.
ingestion.enabled=true