# ===== PERFIL PROD - PostgreSQL (persiste em disco) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/worldcupdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - validate: Hibernate apenas CONFERE o esquema, nao altera.
# Quem cria/altera tabelas agora e o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 console desligado em producao
spring.h2.console.enabled=false

# Flyway habilitado (roda as migracoes no boot)
spring.flyway.enabled=true